# Real mail server for the e2e suite.
#
# GreenMail is a full SMTP/IMAP server implementation, not a stub: the tests
# talk to it over ordinary TCP sockets with ordinary clients. It is used here
# rather than Postfix+Dovecot because this file is the *whole* configuration —
# no Dockerfile, no mounted config tree — which keeps the harness reproducible
# on a machine that has nothing but docker.
#
# Every published port is bound to 127.0.0.1 and deliberately NOT a default
# mail port, so a running suite can never reach, or be reached by, the
# operator's real mailbox. Override via the CLAUDE_EMAIL_E2E_* environment
# variables if 13025/13143/13465/13993 collide on your machine.
#
# The TLS listeners are the ones src/poller.py and src/mailer.py talk to, and
# both build ssl.create_default_context() — hostname verification included. The
# certificate in GreenMail's bundled keystore is CN=GreenMail selfsigned Test
# Certificate with no subjectAltName, and CPython has required a SAN for
# hostname verification since 3.7, so no verifying client can ever accept it.
# The keystore below replaces it: a throwaway keypair generated fresh by the
# harness for each session, SAN 127.0.0.1 + localhost, whose public half the
# child processes are handed as SSL_CERT_FILE. The two required variables are
# written `${VAR:?...}` so a hand-run `docker compose up` fails loudly instead
# of bind-mounting a directory over the keystore path.
services:
  mailserver:
    image: greenmail/standalone:2.1.9
    container_name: ${CLAUDE_EMAIL_E2E_CONTAINER:-claude-email-e2e-mailserver}
    environment:
      # setup.test.all brings up SMTP, SMTPS, IMAP, IMAPS, POP3 and POP3S on
      # GreenMail's standard in-container ports. Both password properties are
      # set to the same value: greenmail.tls.keystore.password defaults to
      # "changeit" but greenmail.tls.key.password has no default at all, and a
      # PKCS12 keystore holds its key under the store password.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=e2e-sender:sender-pw@e2e.test,e2e-recipient:recipient-pw@e2e.test,e2e-bystander:bystander-pw@e2e.test
        -Dgreenmail.verbose
        -Dgreenmail.tls.keystore.file=/etc/greenmail/e2e-keystore.p12
        -Dgreenmail.tls.keystore.password=${CLAUDE_EMAIL_E2E_KEYSTORE_PASSWORD:?generated by the mailserver fixture}
        -Dgreenmail.tls.key.password=${CLAUDE_EMAIL_E2E_KEYSTORE_PASSWORD:?generated by the mailserver fixture}
    volumes:
      - "${CLAUDE_EMAIL_E2E_KEYSTORE:?generated by the mailserver fixture}:/etc/greenmail/e2e-keystore.p12:ro"
    ports:
      - "127.0.0.1:${CLAUDE_EMAIL_E2E_SMTP_PORT:-13025}:3025"
      - "127.0.0.1:${CLAUDE_EMAIL_E2E_IMAP_PORT:-13143}:3143"
      - "127.0.0.1:${CLAUDE_EMAIL_E2E_SMTPS_PORT:-13465}:3465"
      - "127.0.0.1:${CLAUDE_EMAIL_E2E_IMAPS_PORT:-13993}:3993"
